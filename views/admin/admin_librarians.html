<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/api_client.js"></script>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Librarians | Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><link href="/output.css" rel="stylesheet"><link href="/css/admin_dashboard_shared.css" rel="stylesheet">
</head>
<body>
    <script src="/js/admin_dashboard_guard.js"></script>
    <div class="dashboard-shell">
        <aside class="sidebar" id="sidebar"><div class="sidebar-brand"><span class="brand-grid" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></span><span>APNA</span></div><p class="quick-label">Admin Console</p><div class="quick-icons"><a href="/admin/dashboard" title="Dashboard"><i class="fa-solid fa-chart-column"></i></a><a href="/admin/librarians" class="active" title="Librarians"><i class="fa-solid fa-user-tie"></i></a></div><nav class="side-nav" aria-label="Admin navigation"><a href="/admin/dashboard"><i class="fa-solid fa-chart-column"></i> Dashboard</a><a href="/admin/librarians" class="active" aria-current="page"><i class="fa-solid fa-user-tie"></i> Librarians</a><a href="/" data-admin-logout><i class="fa-solid fa-arrow-right-from-bracket"></i> Logout</a></nav><div class="sidebar-footer">Secure Administration Portal<br>APNA Library · 2026</div></aside>
        <button type="button" class="sidebar-overlay" id="sidebarOverlay" aria-label="Close navigation"></button>
        <main class="main-area"><header class="top-header"><button type="button" class="mobile-menu" id="mobileMenuBtn" aria-label="Open navigation" aria-expanded="false"><i class="fa-solid fa-bars"></i></button><div class="top-search"><input id="pageSearch" type="search" placeholder="Search librarians" aria-label="Search librarians"><button type="button" class="search-btn" aria-label="Search"><i class="fa-solid fa-magnifying-glass"></i></button><div class="profile"><span class="profile-name">Administrator</span><span class="avatar">A</span></div></div><div class="welcome"><div class="welcome-title"><span class="home-icon"><i class="fa-solid fa-user-tie"></i></span><span>Librarian Management</span></div><span class="today">Admin workspace</span></div></header><div class="dashboard-content"><section class="report-card"><div class="panel"><div class="panel-head"><h1>Librarians</h1><button type="button" class="action-btn" id="openLibrarianModal">Add Librarian</button></div><div class="filter-bar"><input id="librarianFilter" type="search" placeholder="Search by name or email" aria-label="Filter librarians"></div><div class="table-wrap"><table><thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Status</th></tr></thead><tbody id="librarianTableBody"></tbody></table></div><div class="empty-state hidden" id="librarianEmptyState"><i class="fa-solid fa-user-tie"></i><h2>No librarian records available</h2><p>Add the first librarian using the button above.</p></div></div></section></div></main>
    </div>
    <div id="librarianModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="librarianModalTitle"><div class="modal-card"><div class="modal-title"><h2 id="librarianModalTitle">Add Librarian</h2><button type="button" class="close-modal" id="closeLibrarianModal" aria-label="Close">&times;</button></div><form id="librarianForm"><div class="form-grid"><label class="field field--full">Full Name<input id="librarianName" name="name" type="text" required autocomplete="name" placeholder="Enter full name"></label><label class="field">Email<input name="email" type="email" required autocomplete="email" placeholder="librarian@example.com"></label><label class="field">Phone<input name="phone" type="tel" autocomplete="tel" placeholder="Phone number"></label><label class="field">Password<input name="password" type="password" required minlength="6" autocomplete="new-password" placeholder="At least 6 characters"></label><label class="field">Confirm Password<input name="confirmPassword" type="password" required minlength="6" autocomplete="new-password" placeholder="Repeat password"></label></div><p id="librarianMessage" class="form-message" role="status" aria-live="polite"></p><div class="modal-actions"><button type="button" id="cancelLibrarianModal">Cancel</button><button type="submit" class="primary" id="saveLibrarianButton">Add Librarian</button></div></form></div></div>
    <script src="/js/admin_shell.js"></script><script src="/js/admin_librarians.js"></script>
</body>
</html>
