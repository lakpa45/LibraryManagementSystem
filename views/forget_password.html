<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/output.css">
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

    <!-- Modal Card Matching the Login UI Style -->
    <div class="relative w-full max-w-[420px] bg-white rounded-[2rem] p-8 shadow-2xl border border-gray-100">
        
        <!-- Close / Back Button -->
        <a href="/?login=1" class="absolute top-6 right-6 w-8 h-8 flex items-center justify-center rounded-full bg-[#f4f4f4] hover:bg-gray-200 text-gray-700 transition">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
        </a>

        <!-- Header -->
        <div class="mb-6">
            <h2 class="text-2xl font-bold text-gray-900 tracking-tight">Forgot password?</h2>
            <p class="text-sm text-gray-400 mt-1 font-normal">Enter your email to receive a reset link</p>
        </div>

        <!-- Notification Message Box -->
        <div id="alertBox" role="status" aria-live="polite" class="hidden mb-4 p-3.5 rounded-xl text-sm font-medium"></div>

        <!-- Form -->
        <form id="forgotPasswordForm" class="space-y-4">
            
            <!-- Email Field -->
            <div>
                <label for="email" class="block text-sm font-bold text-gray-900 mb-2">Email</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" autocomplete="email" maxlength="254"
                    placeholder="you@example.com"
                    class="w-full px-4 py-3 rounded-xl border border-gray-200 text-gray-700 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-[#f5a600] focus:border-transparent transition text-sm font-normal"
                    required
                />
            </div>

            <!-- Submit Button -->
            <div class="pt-2">
                <button 
                    type="submit" 
                    id="submitBtn"
                    class="w-full py-3.5 px-4 bg-[#f5a600] hover:bg-[#e09800] active:scale-[0.99] text-gray-950 font-bold rounded-full transition shadow-sm text-base flex items-center justify-center gap-2"
                >
                    <span>Send Reset Link</span>
                </button>
            </div>
            <button id="resendBtn" type="button" disabled class="hidden w-full py-3 px-4 rounded-full border border-gray-200 font-bold disabled:opacity-60 disabled:cursor-not-allowed">Resend Reset Link</button>
            <p id="cooldownText" role="status" aria-live="polite" class="text-sm text-gray-500"></p>
        </form>

        <!-- Footer -->
        <div class="text-center mt-6">
            <p class="text-sm text-gray-500 font-medium">
                Remember your password? 
                <a href="/?login=1" class="font-bold text-gray-900 underline hover:text-black">Login</a>
            </p>
        </div>

    </div>
<script src="/js/forget_password.js"></script>
</body>
</html>
