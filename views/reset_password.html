<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | APNA Library</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="/output.css">

    <script src="/js/reset_password.js" defer></script>
</head>

<body
    class="min-h-screen bg-gray-100 flex items-center justify-center p-4"
    style="font-family: 'Plus Jakarta Sans', sans-serif;"
>
    <main
        class="relative w-full max-w-[420px] bg-white rounded-[2rem] p-8
               shadow-2xl border border-gray-100"
    >
        <!-- Close button -->
        <a
            href="/?login=1"
            aria-label="Return to login"
            class="absolute top-6 right-6 w-8 h-8 flex items-center
                   justify-center rounded-full bg-[#f4f4f4]
                   hover:bg-gray-200 text-gray-700 transition"
        >
            <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-4 w-4"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="2.5"
            >
                <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M6 18L18 6M6 6l12 12"
                />
            </svg>
        </a>

        <!-- Header -->
        <div class="mb-6 pr-8">
            <h1 class="text-2xl font-bold text-gray-900 tracking-tight">
                Reset password
            </h1>

            <p class="text-sm text-gray-400 mt-1">
                Enter and confirm your new password
            </p>
        </div>

        <!-- Status message -->
        <div
            id="alertBox"
            role="alert"
            aria-live="polite"
            class="hidden mb-4 p-3.5 rounded-xl border text-sm font-medium"
        ></div>

        <!-- Reset form -->
        <form id="resetPasswordForm" class="space-y-4">
            <!-- New password -->
            <div>
                <label
                    for="newPassword"
                    class="block text-sm font-bold text-gray-900 mb-2"
                >
                    New password
                </label>

                <input
                    type="password"
                    id="newPassword"
                    name="newPassword"
                    placeholder="Enter your new password"
                    minlength="8" maxlength="72"
                    autocomplete="new-password"
                    required
                    class="w-full px-4 py-3 rounded-xl border border-gray-200
                           text-gray-700 placeholder-gray-400 text-sm
                           focus:outline-none focus:ring-2 focus:ring-[#f5a600]
                           focus:border-transparent transition"
                >

                <p class="mt-1.5 text-xs text-gray-400">
                    Use at least 8 characters (maximum 72 UTF-8 bytes).
                </p>
            </div>

            <!-- Confirm password -->
            <div>
                <label
                    for="confirmPassword"
                    class="block text-sm font-bold text-gray-900 mb-2"
                >
                    Confirm password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    placeholder="Enter the password again"
                    minlength="8" maxlength="72"
                    autocomplete="new-password"
                    required
                    class="w-full px-4 py-3 rounded-xl border border-gray-200
                           text-gray-700 placeholder-gray-400 text-sm
                           focus:outline-none focus:ring-2 focus:ring-[#f5a600]
                           focus:border-transparent transition"
                >
            </div>

            <!-- Submit button -->
            <div class="pt-2">
                <button
                    type="submit"
                    id="submitBtn"
                    class="w-full py-3.5 px-4 bg-[#f5a600]
                           hover:bg-[#e09800] disabled:bg-gray-300
                           disabled:cursor-not-allowed active:scale-[0.99]
                           text-gray-950 font-bold rounded-full transition
                           shadow-sm text-base flex items-center justify-center"
                >
                    <span id="buttonText">Reset Password</span>
                </button>
            </div>
        </form>

        <a id="resendLink" href="/forgot_password.html" class="hidden block text-center mt-6 font-bold underline">Resend reset link</a>

        <!-- The application uses a login modal on the home page. -->
        <div class="text-center mt-6">
            <a
                id="loginLink"
                href="/?login=1"
                class="text-sm font-bold text-gray-900 underline hover:text-black"
            >
                Return to login
            </a>
        </div>
    </main>
</body>
</html>
