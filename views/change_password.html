<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Change password | APNA Library</title>
<style>body{font-family:system-ui;background:#f4f6f8;color:#172b36;margin:0;padding:24px}main{max-width:420px;margin:8vh auto;background:white;padding:32px;border-radius:16px}label{display:block;margin-top:20px}input,button{box-sizing:border-box;width:100%;padding:12px;margin-top:8px}button{background:#183e38;color:white;border:0;border-radius:6px;cursor:pointer}a{color:#183e38}</style>
<script src="/js/change_password.js" defer></script></head><body><main><h1>Choose your password</h1><p>Before using your account, replace your default password with a new password of at least 8 characters.</p>
<form id="passwordForm"><label>Current password<input name="currentPassword" type="password" autocomplete="current-password" required></label><label>New password<input name="newPassword" type="password" autocomplete="new-password" minlength="8" required></label><label>Confirm new password<input name="confirmPassword" type="password" autocomplete="new-password" minlength="8" required></label><button>Change password</button><p id="message" role="status" aria-live="polite"></p></form><a href="/?login=1">Back to login</a></main></body></html>
